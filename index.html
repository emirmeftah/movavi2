<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер задач</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Трекер задач</h1>
    <p>Управляй своими задачами легко и просто</p>
  </header>

  <main>
    <form id="task-form">
      <input type="text" id="task-name" name="name" placeholder="Название задачи" required>
      <button type="submit" aria-label="Отправить"></button>
    </form>

    <p id="error-msg" class="error hidden"></p>
    <p id="loading-msg" class="loading hidden">Загрузка...</p>

    <div id="tasks-list"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
