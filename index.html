<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер задач</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Трекер задач</h1>
    <p>Управляй своими задачами легко и просто</p>
  </header>

  <main>

    <!-- Аналитика -->
    <div id="analytics" class="analytics hidden">
      <div class="stat">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">Всего</span>
      </div>
      <div class="stat">
        <span class="stat-value green" id="stat-done">0</span>
        <span class="stat-label">Выполнено</span>
      </div>
      <div class="stat">
        <span class="stat-value blue" id="stat-pending">0</span>
        <span class="stat-label">Осталось</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-rate">0%</span>
        <span class="stat-label">Прогресс</span>
      </div>
    </div>

    <p id="error-msg" class="error hidden"></p>
    <p id="loading-msg" class="loading hidden">Загрузка...</p>

    <div id="tasks-list"></div>

  </main>

  <form id="task-form">
    <input type="text" id="task-name" name="name" placeholder="Новая задача..." required>
    <button type="submit" aria-label="Добавить"></button>
  </form>

  <script src="app.js"></script>
</body>
</html>
